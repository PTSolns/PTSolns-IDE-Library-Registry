name: Update Libraries

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout main branch
      uses: actions/checkout@v4
      with:
        ref: main # Checkout the main branch
        fetch-depth: 0 # Fetch all history

    - name: Configure Git
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"

    - name: Prepare gh-pages branch
      run: |
        git checkout -B gh-pages
        git push -f origin gh-pages

    - name: Download library_index.tar.bz2
      run: |
        curl -L https://downloads.arduino.cc/libraries/library_index.tar.bz2 -o library_index.tar.bz2

    - name: Extract library_index.json
      run: |
        tar -xf library_index.tar.bz2 library_index.json

    - name: Create custom libraries directory
      run: mkdir -p custom_libraries

    - name: Download custom library.properties files
      run: |
        # Read libraries.txt, convert GitHub repo URLs to raw library.properties URLs
        # and download them into the custom_libraries directory.
        cat libraries.txt | while read repo_url; do
          if [[ "$repo_url" == *"github.com"* ]]; then
            # Assuming main branch, replace with 'refs/heads/main' for raw content URL
            raw_url=$(echo "$repo_url" | sed 's/github.com/raw.githubusercontent.com/' | sed 's/\.git$//')
            properties_url="${raw_url}/refs/heads/main/library.properties"
            repo_name=$(basename "$repo_url" .git)
            echo "Downloading ${properties_url} to custom_libraries/${repo_name}.properties"
            curl -L "$properties_url" -o "custom_libraries/${repo_name}.properties"
          fi
        done

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Merge and compress libraries
      run: |
        cat > merge_script.js << 'EOF'
        const fs = require('fs');

        const arduinoIndex = JSON.parse(fs.readFileSync('library_index.json', 'utf8'));
        const arduinoLibraries = arduinoIndex.libraries || [];

        function parseProperties(content) {
          const lines = content.split('\n').filter(line => line.trim() !== '' && !line.startsWith('#'));
          const obj = {};
          for (const line of lines) {
            const parts = line.split('=');
            if (parts.length > 1) {
              const key = parts[0].trim();
              const value = parts.slice(1).join('=').trim();
              obj[key] = value;
            }
          }
          return obj;
        }

        const arduinoByName = new Map();
        for (const lib of arduinoLibraries) {
          if (lib && lib.name) arduinoByName.set(lib.name, lib);
        }

        const customLibrariesDir = 'custom_libraries';
        const customLibraries = [];

        if (fs.existsSync(customLibrariesDir)) {
          const customFiles = fs.readdirSync(customLibrariesDir);
          for (const file of customFiles) {
            if (!file.endsWith('.properties')) continue;

            const filePath = `${customLibrariesDir}/${file}`;
            const content = fs.readFileSync(filePath, 'utf8');
            const parsed = parseProperties(content);

            if (!parsed.name) continue;

            // Key fix: never override Arduino’s full entry (which contains all releases)
            if (arduinoByName.has(parsed.name)) {
              console.log(`Skipping custom override for existing Arduino library: ${parsed.name}`);
              continue;
            }

            customLibraries.push({ ...parsed, source: 'custom' });
          }
        }

        const finalLibraries = [
          ...arduinoLibraries.map(l => ({ ...l, source: 'arduino' })),
          ...customLibraries
        ];

        fs.writeFileSync('index.json', JSON.stringify({ libraries: finalLibraries }, null, 2));
        console.log(`Wrote index.json with ${finalLibraries.length} libraries`);
        EOF

        node merge_script.js
        tar -cf index.tar index.json
        bzip2 -f index.tar

    - name: Commit and Push Changes
      run: |
        git add index.tar.bz2
        if [ -z "$(git status --porcelain)" ]; then
          echo "No changes to commit."
          exit 0
        fi
        git commit -m "CI: Update library index"
        git push origin gh-pages

