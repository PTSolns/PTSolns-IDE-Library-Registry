name: Update Libraries

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download library_index.tar.bz2
      run: |
        curl -L https://downloads.arduino.cc/libraries/library_index.tar.bz2 -o library_index.tar.bz2

    - name: Extract library_index.json
      run: |
        tar -xf library_index.tar.bz2 library_index.json

    - name: Install jq
      run: sudo apt-get update && sudo apt-get install -y jq bzip2

    - name: Merge and compress libraries
      run: |
        # Generate LOCAL_LIBS with source and save to a temporary file
        jq '.libraries | map(. + {source: "local"})' libraries.json > local_libs_temp.json

        # Generate ARDUINO_LIBS with source and save to a temporary file
        jq '.libraries | map(. + {source: "arduino"})' library_index.json > arduino_libs_temp.json

        # Generate LOCAL_LIB_NAMES from libraries.json
        jq -c '[.libraries[] | .name]' libraries.json > local_lib_names_temp.json

        # Filter out Arduino libraries that are already in localLibraries
        # Read from arduino_libs_temp.json and local_lib_names_temp.json
        jq --argjson local_lib_names "$(cat local_lib_names_temp.json)" \
           '. | map(select(.name as $name | $local_lib_names | index($name) | not))' \
           arduino_libs_temp.json > filtered_arduino_libs_temp.json

        # Merge local_libs_temp.json and filtered_arduino_libs_temp.json
        jq -s '.[0] + .[1]' local_libs_temp.json filtered_arduino_libs_temp.json > merged_libs_array_temp.json

        # Wrap the merged array in a "libraries" object
        jq -n --argjson merged "$(cat merged_libs_array_temp.json)" '{libraries: $merged}' > merged_libraries.json

        # Compress to .tar.bz2
        tar -cvjf merged_libraries.tar.bz2 merged_libraries.json

        # Clean up temporary files
        rm local_libs_temp.json arduino_libs_temp.json local_lib_names_temp.json filtered_arduino_libs_temp.json merged_libs_array_temp.json

    - name: Commit and push to gh-pages
      uses: EndBug/add-and-commit@v9
      with:
        add: 'merged_libraries.tar.bz2'
        branch: 'gh-pages'
        message: 'Update merged libraries'
        author_name: 'github-actions[bot]'
        author_email: 'github-actions[bot]@users.noreply.github.com'
